version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wakmon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wakmon123}
      POSTGRES_DB: ${DB_NAME:-wakmon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
