version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wakmon
      POSTGRES_PASSWORD: wakmon123
      POSTGRES_DB: wakmon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wakmon:wakmon123@db:5432/wakmon_db
      SECRET_KEY: your-secret-key-change-in-production
    depends_on:
      - db
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
